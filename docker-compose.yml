version: "3.8"

services:
  tiktok-sticker-grabber:
    build: .
    container_name: tiktok-sticker-grabber
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MAX_CONCURRENT=3
      - AUTH_FILE=/app/auth.json
    volumes:
      # Mount auth.json so login session persists across container updates
      - ./auth.json:/app/auth.json:ro
    deploy:
      resources:
        limits:
          memory: 1536M
