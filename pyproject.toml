[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-sticker-grabber"
version = "1.0.0"
dependencies = [
    "fastapi",
    "uvicorn",
    "playwright",
    "httpx",
    "jinja2",
    "pydantic",
    "pytest"
]

[tool.setuptools.packages.find]
include = ["web_app*"]
exclude = ["extension*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
